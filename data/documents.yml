# The PDF editions of the documentation: the content of this site for the firmware release named by
# `release`, as documents to read offline or to print. They are kept as Word files outside this
# repository and brought up to date with the site for a release; nothing is written into them
# first. The PDF files are assets of the GitHub release `release` in the public repository, like
# the other downloads (decision D11): upload them there first, then change this file.
#
# main.py renders from this file the list in the frame on the home page, the table on the
# Downloads page and the "Download the PDF ..." line under the applies-to line of every page a
# document names in `pages`: a page path under docs/, or a folder ending in "/" for every page in
# it. A page path wins over a folder, a longer folder over a shorter one. `label` is the text of
# that line's link. tools/check_known_issues.py checks this file before a build.

release: "26.10.1"

