# SHA-256) by tools/release_docs.py of the firmware repository, which also sets `current`; until
# then the fields hold what is known. tools/check_known_issues.py checks this file before a build.
# The files of a published release are the assets of the GitHub release of the same version in this
# repository; the Downloads page links to them once `published` is true (decision D11).

